# Builds The Blue Fit Android app in the cloud.
#
#   push to main/master or a pull request  -> debug APK (installable for testing)
#   push a tag like v1.4.0                 -> signed release APK + AAB, attached to a GitHub Release
#   Actions tab > "Android APK" > Run      -> choose debug or release by hand
#
# One-time setup (Settings > Secrets and variables > Actions):
#   Variables: NEXT_PUBLIC_API_URL          your API Gateway URL (required)
#              VERSION_CODE_OFFSET          optional, add to the run number if you already shipped higher codes
#   Secrets:   ANDROID_KEYSTORE_BASE64      base64 of your upload/release .jks (release builds only)
#              ANDROID_KEYSTORE_PASSWORD
#              ANDROID_KEY_ALIAS
#              ANDROID_KEY_PASSWORD
#              GOOGLE_SERVICES_JSON_BASE64  optional, base64 of android/app/google-services.json (push notifications)

name: Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore: ["backend/**", "**/*.md"]
  pull_request:
    paths-ignore: ["backend/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.build_type == 'release') && 'release' || 'debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      BUILD_TYPE: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.build_type == 'release') && 'release' || 'debug' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check configuration
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::NEXT_PUBLIC_API_URL is not set; this APK will build but cannot reach the API."
            else
              echo "::error::Set the NEXT_PUBLIC_API_URL repository variable (Settings > Secrets and variables > Actions > Variables)."
              exit 1
            fi
          fi
          if [ "$BUILD_TYPE" = "release" ] && [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::Release builds need the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets."
            exit 1
          fi

      - name: Type-check
        run: npx tsc --noEmit

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build web app (static export to out/)
        run: npm run build

      - name: Sync web build and plugins into Android
        run: npx cap sync android

      - name: Health Connect pre-flight
        run: node tools/check-android-health.mjs

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Add google-services.json
        if: env.HAS_GOOGLE_SERVICES == 'true'
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Work out version
        id: version
        run: |
          code=$(( ${{ github.run_number }} + ${{ vars.VERSION_CODE_OFFSET || 0 }} ))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.${code}-${GITHUB_SHA::7}"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building $BUILD_TYPE versionName=$name versionCode=$code"

      - name: Decode signing key
        if: env.BUILD_TYPE == 'release'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK${{ env.BUILD_TYPE == 'release' && ' + AAB' || '' }}
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect outputs
        run: |
          mkdir -p dist
          base="TheBlueFit-${{ steps.version.outputs.name }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/$base.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "dist/$base.aab"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$base-debug.apk"
          fi
          ls -lh dist
          {
            echo "### The Blue Fit $BUILD_TYPE build"
            echo "Version **${{ steps.version.outputs.name }}** (code ${{ steps.version.outputs.code }})"
            echo; echo '```'; ls -lh dist; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: thebluefit-${{ env.BUILD_TYPE }}-${{ steps.version.outputs.name }}
          path: dist/*
          retention-days: ${{ env.BUILD_TYPE == 'release' && 90 || 14 }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "The Blue Fit $GITHUB_REF_NAME" \
            --generate-notes
